<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readest local hybrid prototype</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#18202b;font-family:system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #c7cbd1;background:white}header strong{font-size:15px}button,select{font:inherit;padding:5px 9px}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 69px)}section{overflow:auto;padding:18px;min-width:0}.source img{max-width:100%;display:block;margin:auto}.reader{background:#fff}.body{font-family:Georgia,'Times New Roman',serif;line-height:1.65;overflow-wrap:break-word;max-width:900px;margin:auto}.body p{margin:0 0 1em}.body h3{font-size:1.25em;line-height:1.3}.notice{font-size:13px;line-height:1.5;color:#6b4500;background:#fff6db;padding:10px;margin-bottom:16px}.metrics{font-size:13px;margin-bottom:12px}.crop{display:block;max-width:100%;height:auto;background:white;cursor:zoom-in;margin:7px auto 18px}.inlinecrop{display:inline-block;vertical-align:-.15em;background:white;max-width:100%;cursor:zoom-in}.label{font:12px system-ui;color:#6b7280;margin:12px 0 3px}.zone{border-top:1px solid #d4d7dc;margin-top:22px;padding-top:14px}.dark{background:#161a20;color:#ddd}.dark header,.dark .reader{background:#20262e;color:#ddd}.dark .notice{background:#423a24;color:#f8e9b9}.dark .label{color:#bec5cc}.hidden{display:none}dialog{max-width:96vw;max-height:95vh;overflow:auto}dialog .crop{max-width:none}dialog button{position:sticky;top:0;float:right}body.sourceoff main{grid-template-columns:1fr}body.sourceoff .source{display:none}@media(max-width:850px){main{grid-template-columns:1fr}.source{display:none}body.showSource main{grid-template-columns:1fr}body.showSource .source{display:block}body.showSource .reader{display:none}section{padding:14px}}</style>
<header><strong>本地混合重排原型 · 未发布</strong><select id="page"></select><button id="smaller">A−</button><button id="larger">A＋</button><button id="theme">深浅色</button><button id="source">原页开关</button><span id="size"></span></header>
<main><section class="source"><img id="original" alt="原始 PDF 页面"></section><section class="reader"><div id="notice" class="notice"></div><div id="metrics" class="metrics"></div><article id="content" class="body"></article></section></main><dialog id="zoom"><button onclick="this.parentElement.close()">关闭</button><div></div></dialog>
<script type="module">
const pages=await(await fetch('pages.json')).json(),select=document.querySelector('#page');let font=20,index=0;
pages.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=p.key;select.append(o)});
function sourceSVG(p,b,inline=false,emSize=12,baseline=null,clipBoxes=null){let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`${b.x} ${b.y} ${b.width} ${b.height}`);svg.setAttribute('width',inline?`${b.width/emSize}em`:b.width*1.6);svg.setAttribute('height',inline?`${b.height/emSize}em`:b.height*1.6);svg.classList.add(inline?'inlinecrop':'crop');let image=document.createElementNS(svg.namespaceURI,'image');image.setAttribute('href',p.asset);image.setAttribute('width',p.width);image.setAttribute('height',p.height);if(clipBoxes){let defs=document.createElementNS(svg.namespaceURI,'defs'),clip=document.createElementNS(svg.namespaceURI,'clipPath'),id='clip'+Math.random().toString(36).slice(2);clip.id=id;for(const r of clipBoxes){let rect=document.createElementNS(svg.namespaceURI,'rect');for(const k of ['x','y','width','height'])rect.setAttribute(k,r[k]);clip.append(rect);}defs.append(clip);svg.append(defs);image.setAttribute('clip-path','url(#'+id+')');}svg.append(image);if(inline&&baseline!==null)svg.style.verticalAlign=(-(b.y+b.height-baseline)/emSize)+'em';svg.onclick=()=>{let d=document.querySelector('#zoom');d.querySelector('div').replaceChildren(sourceSVG(p,b,false,12,null,clipBoxes));d.showModal()};return svg;}
function draw(p,block,parent){if(block.kind==='source'){let label=document.createElement('div');label.className='label';label.textContent=block.label;parent.append(label,sourceSVG(p,block.box,false,12,null,block.clipBoxes));return;}let para=document.createElement(block.role==='heading'?'h3':'p');para.dataset.nativeAtoms=JSON.stringify(block.atomIds);for(const r of block.runs){if(r.kind==='source'){for(const b of r.source.boxes)para.append(sourceSVG(p,b,true,r.fontSize,r.baseline));}else{let el=document.createElement('span');el.textContent=r.text;el.dataset.nativeItems=JSON.stringify(r.source.itemIndices);let s=r.style||{};if(s.fontWeight)el.style.fontWeight=s.fontWeight;if(s.fontStyle)el.style.fontStyle=s.fontStyle;if(s.fontFamily)el.style.fontFamily=s.fontFamily;if(s.verticalAlign){el.style.verticalAlign=s.verticalAlign;el.style.fontSize='.78em';}para.append(el);}}parent.append(para);}
function render(){let p=pages[index],content=document.querySelector('#content');content.replaceChildren();content.style.fontSize=font+'px';document.querySelector('#size').textContent=font+'px';document.querySelector('#original').src=p.asset;document.querySelector('#notice').textContent=p.warnings.join(' ');document.querySelector('#metrics').textContent=`实际可选文字 ${p.metrics.reflowTextChars} / ${p.metrics.sourceChars} 字符（${(p.metrics.reflowFraction*100).toFixed(1)}%）；这不是语义正确率。`;p.blocks.forEach(b=>draw(p,b,content));for(const [name,blocks]of [['浮动块 位置和关联待核验',p.floats],['脚注原版',p.notes],['页边原文',p.margins]]){if(!blocks.length)continue;let area=document.createElement('div');area.className='zone';let h=document.createElement('h3');h.textContent=name;area.append(h);blocks.forEach(b=>draw(p,b,area));content.append(area);}}
select.onchange=()=>{index=Number(select.value);render()};document.querySelector('#larger').onclick=()=>{font=Math.min(32,font+2);render()};document.querySelector('#smaller').onclick=()=>{font=Math.max(14,font-2);render()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#source').onclick=()=>{document.body.classList.toggle('sourceoff');document.body.classList.toggle('showSource')};render();
</script></html>
