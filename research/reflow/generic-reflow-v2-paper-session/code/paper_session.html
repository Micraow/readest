<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readest 整篇研究入口</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font:16px/1.5 system-ui,sans-serif}header,main,footer{max-width:920px;margin:auto;padding:12px}h1{font-size:22px;margin:0 0 8px}label{display:inline-flex;gap:5px;align-items:center;max-width:100%}nav,.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}button,select{font:inherit;max-width:100%;padding:6px;border:1px solid #b7c0ca;border-radius:5px;background:white;color:inherit}button:disabled{opacity:.5}select#document{max-width:100%}#status{min-height:1.5em}#limitation{background:#fff4d6;padding:8px;border-left:3px solid #a8790a}#reader-column{width:100%;max-width:100%;margin:auto}#view{width:100%;height:68vh;min-height:340px;overflow:auto;background:white;border:1px solid #bdc5ce;position:relative;overscroll-behavior:contain}#view iframe{display:block;border:0;width:100%;height:100%}.source-sheet{position:relative;line-height:0;max-width:none}.source-sheet img{display:block;width:100%;height:auto}.source-mark{position:absolute;border:2px solid #cf5500;background:#ffcf6038;pointer-events:none}#metadata,#diagnostics{font-size:12px;overflow-wrap:anywhere}#diagnostics{white-space:pre-wrap}a{color:#17599b}#paste{width:100%;min-height:50px}details{margin-top:12px}#view:focus-visible,button:focus-visible{outline:3px solid #226ac9}
</style><header><h1>Readest 整篇研究入口</h1><p>完整原页可读。重排能力逐页标明；未证实的顺序不猜测。</p>
<nav><label>论文 <select id="document" aria-label="论文"></select></label><label>页码 <select id="page" aria-label="页码"></select></label><button id="previous">上一页</button><button id="next">下一页</button></nav>
<div class="toolbar"><button id="source">查看原页</button><button id="reflow">实验重排</button><label>正文字号 <select id="font" aria-label="正文字号"><option>20</option><option>28</option></select></label><label>原页缩放 <select id="zoom" aria-label="原页缩放"><option value="1">适合宽度</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><button id="locate" aria-pressed="false">点击重排内容定位原页</button><button id="narrow">窄屏 390</button></div>
<p id="status" role="status">加载完整论文目录…</p><p id="limitation"></p><a id="original" download>下载完整原 PDF</a> <button id="close">关闭当前会话</button><button id="reopen" disabled>重新打开</button></header>
<main><section id="reader-column"><h2 id="page-title" style="font-size:18px"></h2><div id="view" tabindex="0" aria-label="论文页面"></div><p id="metadata"></p></section>
<details><summary>本地验收记录</summary><pre id="diagnostics"></pre><label for="paste">复制粘贴核对</label><textarea id="paste" aria-label="复制粘贴核对"></textarea></details></main><footer>原页模式保存原 PDF 视觉内容，不提供额外文本识别；可放大查看。实验入口不修改书库或原 PDF，不代表整篇重排验收。</footer><script type="module" src="/paper_app.mjs"></script></html>
