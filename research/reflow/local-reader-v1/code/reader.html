<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>本地原字形试读</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#18212d;font:15px/1.55 system-ui,sans-serif}header{position:sticky;top:0;z-index:1;background:#fffffff5;border-bottom:1px solid #d1d8e0;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 10px 0 0}button,select{font:inherit;border:1px solid #9aa9b8;border-radius:7px;background:#fff;color:#16334f;padding:6px 10px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #277ed0;outline-offset:2px}.notice{max-width:720px;padding:14px 18px;margin:auto;color:#465365}.reader{width:390px;max-width:100%;margin:0 auto 40px;background:#fff;min-height:120px;box-shadow:0 2px 15px #20304015}.piece{margin:0;padding:8px 0 12px;border-bottom:1px solid #eef1f5}.piece>img{display:block;max-width:100%;height:auto}.meta{font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 8px 7px;color:#6b580a}.meta button{font-size:12px;padding:2px 6px}.page-status{padding:10px;color:#795014;background:#fff8e7}.source-only{font-weight:600}.foot{max-width:720px;margin:0 auto;padding:0 18px 30px;color:#566579;font-size:13px}dialog{width:min(1100px,98vw);max-width:98vw;height:92vh;max-height:92vh;padding:0;border:1px solid #789;border-radius:10px;overflow:hidden}dialog::backdrop{background:#0d2031aa}.dialogbar{display:flex;gap:10px;padding:10px;background:#f0f5fa;align-items:center;flex-wrap:wrap}.viewport{height:calc(100% - 105px);overflow:auto;background:#d8dfe7;padding:14px}.sourceframe{position:relative;width:max-content}#highlight{position:absolute;border:3px solid #1170c9;pointer-events:none;display:none}.viewport img{display:block;background:white;max-width:none}.help{font-size:12px;margin:0;padding:8px 12px;color:#4a5969}label{display:flex;gap:6px;align-items:center}#percent{min-width:42px;font-variant-numeric:tabular-nums}#message{white-space:normal} @media(max-width:450px){header{padding:8px}h1{width:100%}.notice{font-size:13px}.viewport{padding:4px}}
</style>
<header><h1>本地原字形试读</h1><select id="page" aria-label="选择页码"></select><button id="original">查看整页原版</button></header>
<p class="notice">实验版。正文按 390px 固定宽度重排；公式和图表可能保留原图。请核对读序与数学关系。点“查看原页位置”可放大、左右移动查看。源文件在本地处理。</p>
<main id="reader" class="reader" aria-label="试读内容"></main><p class="foot">显示效果不代表该页通过结构质量验收。图片文字暂不支持选择、搜索或屏幕阅读器朗读；窗口变窄只会缩放当前排版。</p>
<dialog id="source"><div class="dialogbar"><button id="close">返回试读</button><button id="context">整页定位</button><label>缩放 <input id="scale" type="range" min="15" max="150" step="5" value="50" aria-label="原图缩放"><output id="percent">50%</output></label></div><p id="message" class="help"></p><div class="viewport" tabindex="0" aria-label="可滚动原图区域"><div class="sourceframe"><img id="source-image" alt="原页或原图片段"><div id="highlight"></div></div></div></dialog>
<script id="page-data" type="application/json">__PAGES_JSON__</script>
<script>
'use strict';
const pages=JSON.parse(document.querySelector('#page-data').textContent);
const q=s=>document.querySelector(s),select=q('#page'),reader=q('#reader'),dialog=q('#source'),img=q('#source-image');
let current=0,active=null,context=false,opener=null;
function scale(){const v=Number(q('#scale').value);img.style.width=(img.naturalWidth*v/100)+'px';q('#percent').textContent=v+'%';const box=q('#highlight');box.style.display=context&&active?'block':'none';if(context&&active){const [x,y,r,b]=active.bbox;Object.assign(box.style,{left:x*v/100+'px',top:y*v/100+'px',width:(r-x)*v/100+'px',height:(b-y)*v/100+'px'});}}
function showSource(piece,button){opener=button;active=piece;context=!piece;drawSource();dialog.showModal();q('#close').focus();}
function drawSource(){const p=pages[current];const src=context||!active?p.source:active.source;img.src=src;q('#scale').value=context?'30':'50';img.onload=scale;q('#context').hidden=!active;q('#context').textContent=context?'查看片段':'整页定位';q('#message').textContent=context?(active?'蓝框标出当前片段的原页位置。':'整页原版；可放大并滚动查看。'):'原图片段；放大不会重新排版公式。';scale();q('.viewport').scrollTo(0,0);}
function render(){reader.replaceChildren();const p=pages[current];if(p.refused){const warning=document.createElement('div');warning.className='page-status source-only';warning.textContent='本页保留原版：'+p.reason;reader.append(warning);}p.pieces.forEach((piece,i)=>{const part=document.createElement('section');part.className='piece';const meta=document.createElement('div');meta.className='meta';const label=document.createElement('span');label.textContent=piece.protected?'原图片段':'';const button=document.createElement('button');button.textContent='查看原页位置';button.addEventListener('click',()=>showSource(piece,button));meta.append(label,button);const pic=document.createElement('img');pic.src=piece.display;pic.width=piece.width;pic.height=piece.height;pic.alt=piece.protected?'原版图像片段':'重排后的源字形图像';part.append(meta,pic);reader.append(part);});}
pages.forEach((p,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent='第 '+p.page+' 页';select.append(option);});select.addEventListener('change',()=>{current=Number(select.value);render();window.scrollTo(0,0);});q('#original').addEventListener('click',e=>showSource(null,e.currentTarget));q('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>opener?.focus());q('#context').addEventListener('click',()=>{context=!context;drawSource();});q('#scale').addEventListener('input',scale);render();
</script></html>
