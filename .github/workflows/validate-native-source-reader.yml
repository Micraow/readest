name: Native source reader synthetic Chromium validation

on:
  workflow_dispatch:
  push:
    branches: ['validate/hybrid-reader-chromium-20261008']
    paths:
      - 'validation/native-source-reader/**'
      - '.github/workflows/validate-native-source-reader.yml'

permissions:
  contents: read

concurrency:
  group: native-source-reader-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: validation/native-source-reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: validation/native-source-reader/package-lock.json
      - name: Install isolated validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check synthetic fixture and exact renderer hash
        run: npm run check:fixture
      - name: Install Chromium from Playwright
        run: npx playwright install --with-deps chromium
      - name: Run sandbox-enabled Chromium validation
        run: npm test
      - name: Preserve synthetic screenshots and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-reader-synthetic-evidence
          path: validation/native-source-reader/evidence/
          if-no-files-found: warn
          retention-days: 7
