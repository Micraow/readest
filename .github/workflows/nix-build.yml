name: Build with Nix

on:
  push:
    branches: [main]
    # Documentation and acceptance-build plumbing do not change the Nix app.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'scripts/academic-linux-ci.py'
      - 'scripts/test-academic-linux-ci.py'
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # The explicit Android acceptance lane validates its own target instead.
    if: "!contains(github.event.head_commit.message, '[build-academic-android]')"
    runs-on: ubuntu-latest
    # Cold CEF/Tauri builds can take ~45 minutes; never wait the default 6 hours.
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        name: readest
        skipPush: ${{ vars.ENABLE_AUTOMATED_PUBLISHING != 'true' }}
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: build with nix
      timeout-minutes: 70
      run: nix build -L # --extra-substituters is provided by the cachix action; does not need to be specified  
