name: Academic Linux acceptance build

# A deliberate marker is the connector-compatible equivalent of Run workflow.
# Ordinary source/doc checkpoints do not spend native-build minutes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/academic-linux.yml
      - scripts/academic-linux-ci.py
      - scripts/test-academic-linux-ci.py
      - .github/academic-linux-request.txt

permissions:
  contents: read

concurrency:
  group: academic-linux-acceptance
  cancel-in-progress: false

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-academic-linux]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      READEST_BUILD_SOURCEMAPS: '0'
      RAYON_NUM_THREADS: '1'
      CIRCLE_NODE_TOTAL: '2'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize build submodules
        run: |
          git submodule update --init --recursive -- \
            packages/foliate-js packages/tauri packages/simplecc-wasm packages/js-mdict \
            apps/readest-app/src-tauri/plugins/tauri-plugin-turso \
            apps/readest-app/src-tauri/plugins/tauri-plugin-webview-upgrade
      - name: Verify artifact transfer contract
        run: python3 scripts/test-academic-linux-ci.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install locked JavaScript dependencies and PDF assets
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Check academic code and types
        run: |
          pnpm --filter @readest/readest-app test run src/__tests__/services/academic src/services/academic/__tests__ src/__tests__/components/academic src/components/academic/__tests__ src/__tests__/components/ImageViewer.test.tsx --maxWorkers=2
          pnpm --filter @readest/readest-app lint
      - name: Install native prerequisites
        timeout-minutes: 25
        run: |
          # The runner's Azure mirror has stalled for the entire job budget.
          # Scope official Ubuntu sources to these commands; retain signature checks.
          cat > "$RUNNER_TEMP/academic-ubuntu.list" <<'EOF'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/academic-ubuntu.list"
            -o Dir::Etc::sourceparts=-
            -o Acquire::https::Timeout=30
            -o Acquire::http::Timeout=30
            -o Acquire::Retries=2
          )
          for attempt in 1 2; do
            if sudo timeout --kill-after=30s 5m apt-get "${apt_options[@]}" --error-on=any update; then
              break
            fi
            [ "$attempt" = 2 ] && exit 1
            sleep 10
          done
          sudo timeout --kill-after=30s 10m apt-get "${apt_options[@]}" install -y --no-install-recommends \
            build-essential pkg-config perl libgtk-3-dev curl ca-certificates bzip2 python3 \
            libnss3 libcups2t64 libgbm1 libasound2t64 libudev1 \
            libayatana-appindicator3-1 libxkbcommon-x11-0 libpulse0 libspeechd2 xdg-utils
          timeout --kill-after=30s 3m rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: academic-linux-cef-1.99.0-${{ hashFiles('Cargo.cef.lock') }}
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/readest-cef-cache
          key: academic-cef-linux64-db53c43fdace8b7ee4af0f005120116d6973aa9d8eb7702c0617badf9be8684e
      - name: Verify and prepare pinned CEF
        run: |
          export CEF_PATH="$RUNNER_TEMP/readest-cef/cef_linux_x86_64"
          echo "CEF_PATH=$CEF_PATH" >> "$GITHUB_ENV"
          python3 scripts/academic-linux-ci.py prepare-cef
      - name: Build production frontend
        run: pnpm --filter @readest/readest-app build
      - name: Build Linux CEF executable
        working-directory: apps/readest-app
        run: pnpm tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}' -- --locked
      - name: Verify and export native artifact
        run: python3 scripts/academic-linux-ci.py export-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: academic-linux-manifest
          path: academic-linux-artifact/*.json
          retention-days: 7
          if-no-files-found: error
      # Each ZIP is below the consumer's 32 MiB download limit. No matrix jobs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: academic-linux-part00
          path: academic-linux-artifact/native.part00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part01') != ''
        with:
          name: academic-linux-part01
          path: academic-linux-artifact/native.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part02') != ''
        with:
          name: academic-linux-part02
          path: academic-linux-artifact/native.part02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part03') != ''
        with:
          name: academic-linux-part03
          path: academic-linux-artifact/native.part03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part04') != ''
        with:
          name: academic-linux-part04
          path: academic-linux-artifact/native.part04
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part05') != ''
        with:
          name: academic-linux-part05
          path: academic-linux-artifact/native.part05
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part06') != ''
        with:
          name: academic-linux-part06
          path: academic-linux-artifact/native.part06
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('academic-linux-artifact/native.part07') != ''
        with:
          name: academic-linux-part07
          path: academic-linux-artifact/native.part07
          compression-level: 0
          retention-days: 7
      - name: Gate candidate on unchanged tracked source
        run: python3 scripts/academic-linux-ci.py verify-source
